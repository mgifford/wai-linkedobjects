name: Generate WCAG Standards

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WCAG version to generate'
        required: false
        default: '2.2'
        type: choice
        options:
          - '2.2'
          - '2.1'
          - 'all'
  schedule:
    # Run quarterly on the 1st at 00:00 UTC
    - cron: '0 0 1 */3 *'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate WCAG JSON-LD
        run: |
          python scripts/generate-wcag.py
      
      - name: Validate generated files
        run: |
          python scripts/validate.py
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code standards/wcag-*.jsonld || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: regenerate WCAG standards'
          branch: automated/regenerate-wcag
          delete-branch: true
          title: '🤖 Regenerate WCAG Standards'
          body: |
            ## Automated WCAG Standards Update
            
            This PR contains regenerated WCAG standard files.
            
            ### Changes
            - Regenerated WCAG JSON-LD files using `scripts/generate-wcag.py`
            - All success criteria are now inline and complete
            - Validation passed
            
            ### Review Checklist
            - [ ] Verify success criteria count is correct
            - [ ] Check that new/updated SCs are properly formatted
            - [ ] Ensure Understanding URLs point to correct version
            - [ ] Validate metadata is accurate
            
            Generated by: `${{ github.workflow }}` workflow
            Triggered by: `${{ github.event_name }}`
          labels: |
            automated
            standards-update
            wcag
      
      - name: Summary
        run: |
          echo "## WCAG Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f standards/wcag-2.2.jsonld ]; then
            SC_COUNT=$(grep -c '"@type": "SuccessCriterion"' standards/wcag-2.2.jsonld || echo "0")
            echo "- WCAG 2.2: $SC_COUNT success criteria" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Generation and validation completed successfully" >> $GITHUB_STEP_SUMMARY
