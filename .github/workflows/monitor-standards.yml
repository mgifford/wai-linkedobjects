name: Monitor W3C Standards

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-standards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Check W3C standards
        run: uv run python scripts/fetch-standards.py
      
      - name: Check axe-core rules
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/fetch-axe-rules.py
      
      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitoring-reports
          path: monitoring/
      
      - name: Create issue if changes detected
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            
            let body = '## W3C Standards Monitoring: Failure Detected\n\n';
            body += 'Automated monitoring encountered an error while checking W3C accessibility standards or related tools.\n\n';
            body += '### Actions Required\n';
            body += '1. Review the monitoring reports in the workflow artifacts\n';
            body += '2. Check the workflow logs to identify the failure\n';
            body += '3. Update the corresponding JSON-LD files if actual standards changes are found\n';
            body += '4. Run validation: `uv run python scripts/validate.py`\n';
            body += '5. Close this issue once investigation is complete\n\n';
            body += `Workflow run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔔 W3C Standards Monitoring: Failure Detected',
              body: body,
              labels: ['monitoring', 'standards-update']
            });
